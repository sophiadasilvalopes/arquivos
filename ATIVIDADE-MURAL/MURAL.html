<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="MURAL.css">
    <title>mural de recados</title>
</head>
<body>
     <h1>MURAL DE RECADOS</h1>

    <div class="recado">
        <h2>Recado</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" placeholder="Digite qual o assunto">

        <label for="mensagem">Mensagem:</label>
        <input type="text" id="mensagem" placeholder="Digite sua mensagem">

         <button id="visualizar">Visualizar recado</button>
          <button id="mandar">Mandar recado</button>
    </div>

    <div class="descricao">
        <h2 id="nomedescricao">Nome do Usuário</h2>
        <p id="assuntodescricao">Asunto:</p>
        <p id="mensagemdescricão">Mensagem:</p>

    </div>

    <script src="MURAL.js"></script>

    
</body>
</html>
