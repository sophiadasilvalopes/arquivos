<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style rel="stylesheet" hrel="PÁGINA.css"></style>
</head>
<body>
    <header>
<h1>Catálogo interativo</h1>
<p>Cadastre novos produtos utilizando JavaScript e DOM</p>
    </header>
    <main>
<h2>Cadastrar produto</h2>

<section class="formulario">

<label for="nome">Nome do produto:</label>
<input type="text"; id="nome" placeholder="digite o seu nome">

<label for="categoria">Categoria</label>
<input type="text"; id="categoria" placeholder="digite a categoria">

<label for="preco">Preço do produto:</label>
<input type="number"; id="preco" placeholder="digite o preço">

<label for="descricao">Descrição:</label>
<textarea id="descricao" placeholder="digite uma descrição para o produto"></textarea>

<div class="botoes">

    <button type="button" id="visualizar">Visualizar</button>
    <button type="button" id="adicionar">Adicionar ao catalogo</button>
</div>
<p id="mensagemErro"></p>
</section>

<section class="previa">
<h1>Pré-visualização</h1>
<div></div>

</section>

    </main>
    <footer>
<p>&copy;2026 - Catalogo interativo</p>
    </footer>
    
</body>
</html>
